<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma's Fashion Wear - Admin Login</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
.login-box { max-width: 400px; margin: 60px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.login-box h1 { font-size: 22px; color: #1C3B2D; text-align: center; margin-bottom: 25px; font-weight: 800; }
.login-box input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 15px; outline: none; background: #fafafa; }
.login-box input:focus { border-color: #1C3B2D; background: white; }
.login-box button { width: 100%; padding: 14px; background: #1C3B2D; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.github-btn { background: #24292e !important; display: flex; align-items: center; justify-content: center; gap: 10px; }
.divider { text-align: center; margin: 20px 0; color: #9CA3AF; font-size: 13px; font-weight: 600; position: relative; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #E5E7EB; }
.divider::before { left: 0; } .divider::after { right: 0; }
#error { color: #EF4444; text-align: center; margin-top: 10px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="login-box">
  <h1>Uma's Admin</h1>
  
  <form id="emailLoginForm">
    <input type="email" id="adminEmail" placeholder="Admin Email" required>
    <input type="password" id="adminPassword" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login with Email</button>
  </form>

  <div class="divider">OR</div>

  <button id="githubLogin" class="github-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    Login with GitHub
  </button>
  
  <p id="error"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('error');

  if (email !== 'donnhero6@gmail.com') {
    errorMsg.textContent = 'Access denied. Only authorized admin can login.';
    return;
  }

  btn.textContent = 'Logging in...';
  btn.disabled = true;
  errorMsg.textContent = '';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    errorMsg.textContent = error.message;
    btn.textContent = 'Login with Email';
    btn.disabled = false;
  } else {
    window.location.href = 'dashboard.html';
  }
});

document.getElementById('githubLogin').addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: window.location.origin + '/secret-uma-admin/dashboard.html' }
  });
  if (error) document.getElementById('error').textContent = 'GitHub login failed: ' + error.message;
});
</script>
</body>
</html>
