<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Uma's Fashion Wear</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="dashboard">
  <header>
    <h1>Uma's Fashion Wear - Admin</h1>
    <button id="logoutBtn">Logout</button>
  </header>
  <nav>
    <a href="dashboard">Dashboard</a>
    <a href="products">Products</a>
    <a href="categories">Categories</a>
    <a href="orders">Orders</a>
    <a href="banners">Slider</a>
    <a href="coupons">Coupons</a>
    <a href="settings" class="active">Settings</a>
  </nav>
  <main>
    <h2>Store Settings</h2>
    <p id="loadingText" style="color: #666; margin-bottom: 15px;">Loading settings...</p>
    
    <form id="settingsForm" class="product-form" style="display: none;">
      <label style="font-weight: 600; font-size: 14px;">Store Name</label>
      <input type="text" id="sName" placeholder="Uma's Fashion Wear" required>
      
      <label style="font-weight: 600; font-size: 14px;">Phone Number</label>
      <input type="text" id="sPhone" placeholder="9851169457" required>
      
      <label style="font-weight: 600; font-size: 14px;">Email Address</label>
      <input type="email" id="sEmail" placeholder="donnhero6@gmail.com" required>
      
      <label style="font-weight: 600; font-size: 14px;">Store Address</label>
      <input type="text" id="sAddress" placeholder="Kathmandu, Nepal" required>
      
      <label style="font-weight: 600; font-size: 14px;">Announcement Bar Text (Top)</label>
      <input type="text" id="sAnnouncement" placeholder="Free Delivery inside Kathmandu Valley!">
      
      <button type="submit" id="saveBtn">Save Settings</button>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (!session || session.user.email !== 'donnhero6@gmail.com') {
    window.location.href = 'index';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = 'index';
});

async function loadSettings() {
  const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
  document.getElementById('loadingText').style.display = 'none';
  document.getElementById('settingsForm').style.display = 'flex';

  if (data) {
    document.getElementById('sName').value = data.store_name || '';
    document.getElementById('sPhone').value = data.store_phone || '';
    document.getElementById('sEmail').value = data.store_email || '';
    document.getElementById('sAddress').value = data.store_address || '';
    document.getElementById('sAnnouncement').value = data.announcement_text || '';
  }
}

document.getElementById('settingsForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.textContent = 'Saving...';
  saveBtn.disabled = true;

  const store_name = document.getElementById('sName').value;
  const store_phone = document.getElementById('sPhone').value;
  const store_email = document.getElementById('sEmail').value;
  const store_address = document.getElementById('sAddress').value;
  const announcement_text = document.getElementById('sAnnouncement').value;

  const { error } = await supabaseClient.from('settings').upsert({
    id: 1, store_name, store_phone, store_email, store_address, announcement_text
  });

  if (error) {
    alert('Error: ' + error.message);
  } else {
    alert('Settings saved successfully!');
  }
  
  saveBtn.textContent = 'Save Settings';
  saveBtn.disabled = false;
});

loadSettings();
</script>
</body>
</html>
