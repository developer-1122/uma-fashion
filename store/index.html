<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Uma's Fashion Wear</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="/store/style.css">
</head>
<body>
<div class="announcement-bar" id="announcementBar">Free Delivery inside Kathmandu Valley!</div>
<header>
  <a href="/store/" style="text-decoration: none; display: flex; align-items: center;">
    <img src="/store/logo.jpg" alt="Uma's Fashion Wear" style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color);">
  </a>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search for products..." oninput="handleSearch()" autocomplete="off">
    <div id="searchDropdown" class="search-dropdown"></div>
  </div>
  <button onclick="toggleDarkMode()" style="background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 5px;">🌓</button>
  <a href="cart" class="cart-icon" id="headerCartIcon">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
    <span class="cart-count" id="cartCount">0</span>
  </a>
</header>

<div class="slider-container">
  <div class="slider" id="slider"></div>
</div>

<div class="container">
  <div class="filter-row">
    <div class="category-filters" id="categoryFilters">
      <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
    </div>
  </div>

  <h2 class="section-title">Trending Products</h2>
  <div id="storeProducts" class="product-grid"></div>
  <button id="loadMoreBtn" onclick="loadMoreProducts()" style="display: none; width: 100%; padding: 15px; background: var(--bg-subtle); color: var(--text-main); border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 20px;">Load More</button>
</div>

<div class="footer">
  <h2>Uma's Fashion Wear</h2>
  <p>Kathmandu, Nepal | 9851169457</p>
  <div class="newsletter-box">
    <input type="email" id="subEmail" placeholder="Enter your email for offers">
    <button onclick="subscribeNewsletter()">Subscribe</button>
  </div>
  <div class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Contact Us</a>
  </div>
  <p style="font-size: 12px; margin-top: 20px;">© 2026 Uma's Fashion Wear. All rights reserved.</p>
</div>

<a href="https://wa.me/9779851169457" class="whatsapp-float" target="_blank">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
</a>

<div class="bottom-nav">
  <a href="/store/" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a href="wishlist" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
  <a href="cart" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Cart</span></a>
  <a href="profile" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (localStorage.getItem('uma_theme') === 'dark') document.body.classList.add('dark-mode');
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('uma_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }

let allProducts = []; let displayedProducts = 12; let currentCategory = 'all'; let currentSearch = ''; let wishlist = JSON.parse(localStorage.getItem('uma_wishlist')) || []; let currentSlide = 0;

async function subscribeNewsletter() {
  const email = document.getElementById('subEmail').value;
  if (!email) { alert('Please enter an email.'); return; }
  const { error } = await supabaseClient.from('subscribers').insert([{ email }]);
  if (error) { if (error.code === '23505') alert('You are already subscribed!'); else alert('Error subscribing.'); } 
  else { alert('Thank you for subscribing!'); document.getElementById('subEmail').value = ''; }
}

async function loadSettings() {
  const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
  if (data) {
    if (data.announcement_text) { document.getElementById('announcementBar').textContent = data.announcement_text; } else { document.getElementById('announcementBar').style.display = 'none'; }
  }
}

async function loadBanners() {
  const { data } = await supabaseClient.from('banners').select('*').eq('is_active', true);
  const slider = document.getElementById('slider'); slider.innerHTML = '';
  if (data && data.length > 0) {
    data.forEach(b => { const link = b.link ? b.link : 'javascript:void(0)'; slider.innerHTML += `<a href="${link}" class="slide" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${b.image_url}');"><h2>${b.title}</h2><p>${b.subtitle}</p></a>`; });
    setInterval(() => { const slides = document.querySelectorAll('.slide'); if (slides.length > 0) { currentSlide = (currentSlide + 1) % slides.length; slider.style.transform = `translateX(-${currentSlide * 100}%)`; } }, 3000);
  } else {
    slider.innerHTML = `<div class="slide" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1000&auto=format&fit=crop');"><h2>New Arrivals</h2><p>Discover the latest trends</p></div>`;
  }
}

async function loadCategories() {
  const { data } = await supabaseClient.from('categories').select('*');
  const container = document.getElementById('categoryFilters');
  if (data) { data.forEach(c => { container.innerHTML += `<button class="filter-btn" onclick="setCategory('${c.name}', this)">${c.name}</button>`; }); }
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('uma_cart')) || [];
  document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
}

async function loadStoreProducts() {
  const { data, error } = await supabaseClient.from('products').select('*, categories(name)').eq('is_active', true).gt('stock', 0);
  if (!error && data) { allProducts = data; filterProducts(); }
}

window.handleSearch = function() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  const dropdown = document.getElementById('searchDropdown');
  
  if (currentSearch.length > 0) {
    const matches = allProducts.filter(p => p.name.toLowerCase().includes(currentSearch)).slice(0, 5);
    if (matches.length > 0) {
      dropdown.innerHTML = '';
      matches.forEach(p => {
        const img = p.images && p.images.length > 0 ? p.images[0] : 'https://picsum.photos/200';
        dropdown.innerHTML += `
          <a href="product?id=${p.id}" class="search-item">
            <img src="${img}" alt="${p.name}">
            <div class="search-item-info">
              <h4>${p.name}</h4>
              <p>Rs. ${parseFloat(p.price).toLocaleString('en-IN')}</p>
            </div>
          </a>
        `;
      });
      dropdown.classList.add('active');
    } else {
      dropdown.classList.remove('active');
    }
  } else {
    dropdown.classList.remove('active');
  }
  filterProducts();
}

document.addEventListener('click', function(event) {
  const searchContainer = document.querySelector('.search-container');
  if (!searchContainer.contains(event.target)) {
    document.getElementById('searchDropdown').classList.remove('active');
  }
});

function filterProducts() {
  let filtered = allProducts;
  if (currentCategory !== 'all') filtered = filtered.filter(p => p.categories && p.categories.name === currentCategory);
  if (currentSearch) filtered = filtered.filter(p => p.name.toLowerCase().includes(currentSearch));
  filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  displayedProducts = 12; renderProducts(filtered);
}

function renderProducts(list) {
  const grid = document.getElementById('storeProducts'); const loadMoreBtn = document.getElementById('loadMoreBtn'); grid.innerHTML = '';
  if (list.length === 0) { grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 20px;">No products found.</p>'; loadMoreBtn.style.display = 'none'; return; }
  const toDisplay = list.slice(0, displayedProducts);
  toDisplay.forEach(p => {
    const imageUrl = p.images && p.images.length > 0 ? p.images[0] : 'https://picsum.photos/200'; const isWishlisted = wishlist.includes(p.id);
    let discountHtml = '', mrpHtml = '';
    if (p.mrp && p.mrp > p.price) { 
      const discountPercent = Math.round(((p.mrp - p.price) / p.mrp) * 100); 
      mrpHtml = `<span class="mrp">Rs. ${parseFloat(p.mrp).toLocaleString('en-IN')}</span>`; 
      discountHtml = `<span class="discount">(${discountPercent}% OFF)</span>`; 
    }
    
    grid.innerHTML += `
      <div class="product-card">
        <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="toggleWishlist(event, ${p.id}, this)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></button>
        <a href="product?id=${p.id}" style="text-decoration: none; color: inherit;">
          <img src="${imageUrl}" alt="${p.name}">
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="price-row">
              <p class="price">Rs. ${parseFloat(p.price).toLocaleString('en-IN')}</p>
              ${mrpHtml}
              ${discountHtml}
            </div>
          </div>
        </a>
      </div>`;
  });
  if (displayedProducts >= list.length) loadMoreBtn.style.display = 'none'; else loadMoreBtn.style.display = 'block';
  window.currentFilteredList = list;
}

window.loadMoreProducts = function() { displayedProducts += 12; renderProducts(window.currentFilteredList); }
window.toggleWishlist = function(e, id, btn) { e.preventDefault(); if (wishlist.includes(id)) { wishlist = wishlist.filter(item => item !== id); btn.classList.remove('active'); } else { wishlist.push(id); btn.classList.add('active'); } localStorage.setItem('uma_wishlist', JSON.stringify(wishlist)); }
window.setCategory = function(cat, btn) { currentCategory = cat; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); filterProducts(); }

updateCartCount(); loadSettings(); loadBanners(); loadCategories(); loadStoreProducts();
</script>
</body>
</html>
