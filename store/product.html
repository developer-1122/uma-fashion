<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C3B2D">
<title>Product Details - Uma's Fashion Wear</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="/store/style.css">
<style>.gallery-main { width: 100%; height: 400px; object-fit: cover; border-radius: 20px; cursor: zoom-in; } @media (min-width: 768px) { .gallery-main { height: 500px; } }</style>
</head>
<body>
<header>
  <a href="/store/" style="color: var(--text-main); text-decoration: none; display: flex; align-items: center;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
  <h1 style="font-size: 20px; margin: 0; flex: 1; font-weight: 800;">Details</h1>
  <button onclick="toggleDarkMode()" style="background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 10px;">🌓</button>
  <a href="cart" class="cart-icon" id="headerCartIcon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span class="cart-count" id="cartCount">0</span></a>
</header>

<div class="sticky-action-bar" id="stickyBar" style="position: fixed; top: 65px; left: 0; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px); padding: 12px 20px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 100; border-bottom: 1px solid var(--border-color);">
  <p id="stickyPrice" style="font-size: 20px; font-weight: 800; color: var(--gold); margin: 0;">Rs. 0</p>
  <button onclick="addToCart(false)" style="padding: 12px 30px; background: var(--primary); color: var(--primary-text); border: none; border-radius: 30px; font-weight: 800; font-size: 15px; cursor: pointer;">Add to Cart</button>
</div>

<div class="container" style="margin-top: 20px;">
  <div id="productDetail" class="product-detail"></div>
  <div id="reviewSection" style="margin-top: 30px; display: none;">
    <h2 class="section-title">Customer Reviews</h2><div id="reviewsList"></div>
    <div class="review-form"><h3>Write a Review</h3><input type="text" id="rName" placeholder="Your Name" required><select id="rRating" required><option value="5">⭐⭐⭐⭐⭐ (Excellent)</option><option value="4">⭐⭐⭐⭐ (Good)</option><option value="3">⭐⭐⭐ (Average)</option><option value="2">⭐⭐ (Poor)</option><option value="1">⭐ (Terrible)</option></select><textarea id="rComment" placeholder="Write your experience..." required></textarea><button onclick="submitReview()">Submit Review</button></div>
  </div>
  <div id="relatedSection" style="margin-top: 40px; display: none;"><h2 class="section-title">You May Also Like</h2><div id="relatedProducts" class="horizontal-scroll"></div></div>
</div>

<div id="imageModal" class="modal-overlay" onclick="closeImageModal()"><div class="image-modal-content"><img src="" id="zoomedImage" style="width:100%; border-radius:12px;"></div></div>

<a href="https://wa.me/9779851169457" class="whatsapp-float" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg></a>

<div class="bottom-nav">
  <a href="/store/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a href="wishlist" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
  <a href="cart" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Cart</span></a>
  <a href="profile" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (localStorage.getItem('uma_theme') === 'dark') document.body.classList.add('dark-mode');
function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('uma_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }

let productData = null; let selectedSize = ''; let selectedColor = ''; let currentProductId = null; let currentQuantity = 1;

window.openImageModal = function(url) { document.getElementById('zoomedImage').src = url; document.getElementById('imageModal').classList.add('active'); }
window.closeImageModal = function() { document.getElementById('imageModal').classList.remove('active'); }
function showToast(message) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = message; document.body.appendChild(t); setTimeout(() => t.classList.add('show'), 10); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500); }
function updateCartCount() { const cart = JSON.parse(localStorage.getItem('uma_cart')) || []; document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0); }
function getStarHtml(rating) { let html = ''; for (let i = 1; i <= 5; i++) html += `<span class="star ${i <= rating ? 'filled' : ''}">★</span>`; return html; }
window.changeMainImage = function(url, thumb) { document.getElementById('mainProductImg').src = url; document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active')); thumb.classList.add('active'); }

async function loadProduct() {
  const params = new URLSearchParams(window.location.search); const id = params.get('id'); currentProductId = id;
  if (!id) { window.location.href = '/store/'; return; }
  const { data, error } = await supabaseClient.from('products').select('*').eq('id', id).single();
  if (error || !data) { document.getElementById('productDetail').innerHTML = '<h2>Product not found.</h2>'; return; }

  productData = data;
  const images = data.images && data.images.length > 0 ? data.images : ['https://picsum.photos/200'];
  const sizes = data.sizes && data.sizes.length > 0 ? data.sizes : ['Free Size'];
  const colors = data.colors && data.colors.length > 0 ? data.colors : ['Default'];
  const deliveryDate = new Date(); deliveryDate.setDate(deliveryDate.getDate() + 3);
  
  let sizesHtml = ''; sizes.forEach((s, index) => { sizesHtml += `<button class="size-btn ${index === 0 ? 'active' : ''}" onclick="selectSize('${s}', this)" style="padding: 10px 20px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-muted);">${s}</button>`; }); selectedSize = sizes[0];
  let colorsHtml = ''; colors.forEach((c, index) => { colorsHtml += `<button class="color-btn ${index === 0 ? 'active' : ''}" onclick="selectColor('${c}', this)" style="padding: 8px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted);">${c}</button>`; }); selectedColor = colors[0];
  let thumbsHtml = ''; images.forEach((img, idx) => { thumbsHtml += `<img src="${img}" class="gallery-thumb ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; opacity: 0.6; border: 2px solid transparent;">`; });
  let mrpHtml = data.mrp && data.mrp > data.price ? `<p class="mrp">Rs. ${data.mrp}</p>` : '';

  const { data: reviews } = await supabaseClient.from('reviews').select('rating').eq('product_id', id);
  let avgRating = 0; if (reviews && reviews.length > 0) avgRating = Math.round(reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length);

  let actionButtons = data.stock > 0 ? `
    <div class="qty-picker" style="display:flex; align-items:center; gap:15px; border:1px solid var(--border-color); padding:8px 15px; border-radius:12px; width:fit-content;"><button onclick="updateQty(-1)" style="background:none; border:none; font-size:20px; font-weight:bold; cursor:pointer; color:var(--text-main); padding:0 10px;">-</button><span id="qtyDisplay" style="font-weight:700; font-size:16px; width:20px; text-align:center;">1</span><button onclick="updateQty(1)" style="background:none; border:none; font-size:20px; font-weight:bold; cursor:pointer; color:var(--text-main); padding:0 10px;">+</button></div>
    <button class="buy-now-btn" onclick="addToCart(false)" style="padding: 16px; font-size: 16px; background: var(--primary); color: var(--primary-text); border: none; border-radius: 12px; font-weight: 800; margin-top:10px;">Add to Cart</button>
    <button onclick="addToCart(true)" style="padding: 16px; font-size: 16px; background: transparent; color: var(--primary); border: 2px solid var(--primary); border-radius: 12px; font-weight: 800; margin-top:10px;">Buy Now</button>
  ` : `<button style="padding: 16px; font-size: 16px; background: #9CA3AF; cursor: not-allowed; color: white; border: none; border-radius: 12px; font-weight: 800;">Out of Stock</button>`;

  document.getElementById('productDetail').innerHTML = `
    <div class="gallery-container" style="position:relative; width:100%; overflow:hidden;">
      <img src="${images[0]}" id="mainProductImg" class="gallery-main" onclick="openImageModal('${images[0]}')">
      <div class="gallery-thumbs" style="display:flex; gap:10px; overflow-x:auto; padding:15px; scrollbar-width:none;">${thumbsHtml}</div>
    </div>
    <div class="detail-info" style="padding:20px; flex:1; display:flex; flex-direction:column; gap:18px;">
      <h2 style="font-size: 24px; color: var(--text-main); font-weight: 800;">${data.name}</h2>
      <div class="stars" style="display:flex; align-items:center; gap:4px;">${getStarHtml(avgRating)} <span style="font-size: 13px; color: var(--text-muted); margin-left: 8px;">(${reviews ? reviews.length : 0} reviews)</span></div>
      <div style="display: flex; align-items: center; gap: 15px;"><p class="price" style="font-size: 24px; color: var(--gold); font-weight: 800;">Rs. ${data.price}</p>${mrpHtml}</div>
      <div style="background: rgba(28, 59, 45, 0.05); padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px;">🚚 Estimated Delivery by <strong>${deliveryDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</strong></div>
      <p class="desc" style="font-size: 15px; color: var(--text-muted); line-height: 1.6;">${data.description || 'No description available.'}</p>
      
      <div><p style="font-size: 15px; font-weight: bold; margin-bottom: 10px;">Select Color:</p><div class="size-options" style="display:flex; gap:10px; flex-wrap:wrap;">${colorsHtml}</div></div>
      <div><div class="size-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><p style="font-size: 15px; font-weight: bold; margin: 0;">Select Size:</p></div><div class="size-options" style="display:flex; gap:10px; flex-wrap:wrap;">${sizesHtml}</div></div>
      <div style="display:flex; flex-direction:column; gap:10px;">${actionButtons}</div>
      
      <div class="trust-badges">
        <div class="badge-item"><span>🛡️</span>100% Original</div>
        <div class="badge-item"><span>🔄</span>7 Days Return</div>
        <div class="badge-item"><span>🚚</span>Fast Delivery</div>
      </div>
    </div>
  `;

  document.getElementById('stickyBar').style.display = 'flex'; document.getElementById('stickyPrice').textContent = `Rs. ${data.price}`;
  loadReviews(); loadRelatedProducts(data.category_id);
}

window.updateQty = function(change) { currentQuantity = Math.max(1, currentQuantity + change); document.getElementById('qtyDisplay').textContent = currentQuantity; }
window.selectSize = function(size, btn) { selectedSize = size; document.querySelectorAll('.size-btn').forEach(b => { b.classList.remove('active'); b.style.background = 'var(--card-bg)'; b.style.color = 'var(--text-muted)'; b.style.borderColor = 'var(--border-color)'; }); btn.classList.add('active'); btn.style.background = 'var(--primary)'; btn.style.color = 'var(--primary-text)'; btn.style.borderColor = 'var(--primary)'; if (navigator.vibrate) navigator.vibrate(20); }
window.selectColor = function(color, btn) { selectedColor = color; document.querySelectorAll('.color-btn').forEach(b => { b.classList.remove('active'); b.style.background = 'var(--card-bg)'; b.style.color = 'var(--text-muted)'; b.style.borderColor = 'var(--border-color)'; }); btn.classList.add('active'); btn.style.background = 'var(--primary)'; btn.style.color = 'var(--primary-text)'; btn.style.borderColor = 'var(--primary)'; if (navigator.vibrate) navigator.vibrate(20); }

window.addToCart = function(isBuyNow) {
  if (!productData) return;
  if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
  const img = document.getElementById('mainProductImg');
  if (img) { const flyDot = document.createElement('img'); flyDot.src = img.src; flyDot.className = 'fly-dot'; const imgRect = img.getBoundingClientRect(); flyDot.style.left = imgRect.left + 'px'; flyDot.style.top = imgRect.top + 'px'; document.body.appendChild(flyDot); const cartIcon = document.getElementById('headerCartIcon'); const cartRect = cartIcon.getBoundingClientRect(); setTimeout(() => { flyDot.style.left = cartRect.left + 'px'; flyDot.style.top = cartRect.top + 'px'; flyDot.style.transform = 'scale(0.1)'; flyDot.style.opacity = '0'; }, 50); setTimeout(() => flyDot.remove(), 850); }

  let cart = JSON.parse(localStorage.getItem('uma_cart')) || [];
  const cartId = `${productData.id}-${selectedSize}-${selectedColor}`;
  const existingItem = cart.find(item => item.cartId === cartId);
  if (existingItem) { existingItem.quantity += currentQuantity; } 
  else { cart.push({ cartId: cartId, id: productData.id, name: productData.name, price: productData.price, image: productData.images[0], size: selectedSize, color: selectedColor, quantity: currentQuantity }); }
  localStorage.setItem('uma_cart', JSON.stringify(cart));
  setTimeout(() => { updateCartCount(); }, 800);
  if (isBuyNow) { setTimeout(() => window.location.href = 'cart', 500); } else { setTimeout(() => showToast('Added to cart successfully!'), 500); }
}

async function loadReviews() {
  const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('product_id', currentProductId).order('created_at', { ascending: false });
  const list = document.getElementById('reviewsList'); document.getElementById('reviewSection').style.display = 'block'; list.innerHTML = '';
  if (!reviews || reviews.length === 0) { list.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">No reviews yet. Be the first to review!</p>'; return; }
  reviews.forEach(r => { const date = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); list.innerHTML += `<div class="review-card" style="background: var(--bg-color); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color);"><div class="review-header" style="display:flex; justify-content:space-between; margin-bottom:8px;"><div><strong style="font-size:14px; color:var(--text-main);">${r.customer_name}</strong><div class="stars" style="margin-top: 4px; display:flex; align-items:center; gap:4px;">${getStarHtml(r.rating)}</div></div><span style="font-size:12px; color:var(--text-muted);">${date}</span></div><p style="font-size: 14px; color: var(--text-muted); line-height: 1.5;">${r.comment}</p></div>`; });
}

window.submitReview = async function() {
  const name = document.getElementById('rName').value; const rating = document.getElementById('rRating').value; const comment = document.getElementById('rComment').value;
  if (!name || !comment) { showToast('Please fill your name and comment.'); return; }
  const { error } = await supabaseClient.from('reviews').insert([{ product_id: currentProductId, customer_name: name, rating: parseInt(rating), comment: comment }]);
  if (error) { showToast('Error submitting review.'); } else { showToast('Review submitted!'); document.getElementById('rName').value = ''; document.getElementById('rComment').value = ''; loadReviews(); loadProduct(); }
}

async function loadRelatedProducts(categoryId) {
  const { data } = await supabaseClient.from('products').select('*').eq('category_id', categoryId).neq('id', currentProductId).limit(5);
  const grid = document.getElementById('relatedProducts'); const section = document.getElementById('relatedSection');
  if (!data || data.length === 0) return;
  section.style.display = 'block'; grid.innerHTML = '';
  data.forEach(p => { const imageUrl = p.images && p.images.length > 0 ? p.images[0] : 'https://picsum.photos/200'; grid.innerHTML += `<a href="product?id=${p.id}" class="horizontal-card" style="min-width:140px; background:var(--card-bg); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; box-shadow: 0 4px 15px rgba(0,0,0,0.03);"><img src="${imageUrl}" style="width:100%; height:180px; object-fit:cover;"><div style="padding:10px;"><h3 style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; color:var(--text-main);">${p.name}</h3><div style="font-size:14px; font-weight:800; color:var(--gold);">Rs. ${p.price}</div></div></a>`; });
}

updateCartCount(); loadProduct();
</script>
</body>
</html>
