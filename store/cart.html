<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Cart - Uma's Fashion Wear</title>
<link rel="manifest" href="manifest.json">
<!-- Added ?v=2 to force browsers to load the latest CSS -->
<link rel="stylesheet" href="/store/style.css?v=2">
</head>
<body>
<header>
  <a href="/store/" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
    <img src="/store/logo.jpg" alt="Uma's Fashion Wear" style="height: 36px; width: 36px; border-radius: 50%; object-fit: cover;">
  </a>
  <div style="flex: 1; display: flex; justify-content: center;">
    <h1 style="font-size: 18px; margin: 0; font-weight: 800;">My Cart</h1>
  </div>
  <div style="width: 36px;"></div>
</header>

<div class="container" style="margin-top: 20px;">
  
  <div id="cartItems" class="cart-container"></div>

  <div id="checkoutBox" style="display: none;">
    
    <div class="bill-details">
      <h3>Order Details</h3>
      <div class="bill-row"><span>Subtotal</span><span id="billSubtotal">Rs. 0</span></div>
      <div class="bill-row discount" id="billDiscountRow" style="display: none;"><span>Discount</span><span id="billDiscount">- Rs. 0</span></div>
      <div class="bill-row shipping"><span>Shipping Fee</span><span id="billShipping">Rs. 0</span></div>
      <div class="bill-row total"><span>Total</span><span id="billTotal">Rs. 0</span></div>
    </div>

    <div class="checkout-section">
      <h3>Voucher</h3>
      <div class="voucher-box">
        <input type="text" id="couponInput" placeholder="Enter Voucher Code">
        <button onclick="applyCoupon()">Apply</button>
      </div>
      <p id="couponMsg" style="font-size: 13px; font-weight: 600; margin-top: -5px;"></p>
    </div>

    <div class="checkout-section">
      <h3>Delivery Details</h3>
      <form id="checkoutForm" class="checkout-box">
        <input type="text" id="cName" placeholder="Full Name" required>
        <input type="tel" id="cPhone" placeholder="Phone Number (98XXXXXXXX)" pattern="[9][678][0-9]{8}" maxlength="10" required>
        <select id="cDistrict" required>
          <option value="">Select District</option>
          <option value="Kathmandu">Kathmandu</option>
          <option value="Lalitpur">Lalitpur</option>
          <option value="Bhaktapur">Bhaktapur</option>
          <option value="Kaski">Kaski</option>
          <option value="Chitwan">Chitwan</option>
          <option value="Other">Other District</option>
        </select>
        <textarea id="cAddress" placeholder="Full Delivery Address" required></textarea>
        
        <h3 style="margin: 20px 0 15px;">Payment Method</h3>
        <div class="payment-options">
          <label class="pay-option"><input type="radio" name="payment" value="Cash on Delivery" checked onchange="toggleQR()"><span style="flex: 1;">Cash on Delivery</span></label>
          <label class="pay-option"><input type="radio" name="payment" value="eSewa" onchange="toggleQR()"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Esewa_Logo.svg/256px-Esewa_Logo.svg.png" alt="eSewa" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span style="display: none; color: #60bb46; font-weight: 800;">eSewa</span></label>
          <label class="pay-option"><input type="radio" name="payment" value="Khalti" onchange="toggleQR()"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Khalti_Logo.svg/256px-Khalti_Logo.svg.png" alt="Khalti" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><span style="display: none; color: #5c2d91; font-weight: 800;">Khalti</span></label>
          <label class="pay-option"><input type="radio" name="payment" value="Fonepay QR" onchange="toggleQR()"><span style="flex: 1; font-weight: 700;">Pay via Fonepay QR</span></label>
        </div>

        <div id="qrSection" class="qr-container">
          <p>Scan this QR with any Bank App or Fonepay</p>
          <img src="/store/qr.png" alt="Fonepay QR Code">
          <p style="margin-top: 10px;">After payment, enter the Transaction ID below:</p>
          <input type="text" id="txnId" placeholder="Enter Transaction ID">
        </div>

        <button type="submit" id="formSubmitBtn" style="display: none;"></button>
      </form>
    </div>
  </div>
</div>

<div class="sticky-checkout-bar" id="stickyCheckoutBar">
  <div class="sticky-checkout-inner">
    <div class="sticky-total-text">
      <span>Total</span>
      <strong id="stickyTotal">Rs. 0</strong>
    </div>
    <button class="place-order-btn" onclick="document.getElementById('formSubmitBtn').click()">Place Order</button>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p>Confirming your order...</p>
</div>

<div class="bottom-nav" style="z-index: 1002;">
  <a href="/store/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a href="/store/wishlist" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
  <a href="/store/cart" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Cart</span></a>
  <a href="/store/profile" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (localStorage.getItem('uma_theme') === 'dark') document.body.classList.add('dark-mode');

let cart = JSON.parse(localStorage.getItem('uma_cart')) || [];
let appliedCoupon = null; let discountAmount = 0; let shippingFee = 0; let currentUser = null;

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  container.className = `toast-container toast-${type} show`;
  container.innerHTML = (type === 'success' ? '✅ ' : '⚠️ ') + message;
  setTimeout(() => { container.classList.remove('show'); }, 3000);
}

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    const savedInfo = JSON.parse(localStorage.getItem('uma_user_info'));
    if (savedInfo) {
      document.getElementById('cName').value = savedInfo.name || '';
      document.getElementById('cPhone').value = savedInfo.phone || '';
      document.getElementById('cDistrict').value = savedInfo.district || '';
      document.getElementById('cAddress').value = savedInfo.address || '';
    }
  }
});

function toggleQR() {
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  const qrSection = document.getElementById('qrSection');
  if (paymentMethod === 'Fonepay QR') { qrSection.style.display = 'block'; } 
  else { qrSection.style.display = 'none'; }
}

function getDeliveryDate() {
  const date = new Date();
  date.setDate(date.getDate() + 3);
  return date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

function renderCart() {
  const itemsDiv = document.getElementById('cartItems');
  const checkoutBox = document.getElementById('checkoutBox');
  const stickyBar = document.getElementById('stickyCheckoutBar');
  
  itemsDiv.innerHTML = ''; let subtotal = 0;

  if (cart.length === 0) {
    itemsDiv.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Your cart is empty.</p>';
    checkoutBox.style.display = 'none'; stickyBar.style.display = 'none'; return;
  }

  checkoutBox.style.display = 'block'; stickyBar.style.display = 'block';

  cart.forEach((item, index) => {
    subtotal += item.price * item.quantity;
    itemsDiv.innerHTML += `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-details">
          <h3>${item.name}</h3>
          <p class="variation">Size: ${item.size || 'Free'} | Color: ${item.color || 'Default'}</p>
          <p class="price">Rs. ${parseFloat(item.price).toLocaleString('en-IN')}</p>
          <p class="delivery-date">🚚 Guaranteed by ${getDeliveryDate()}</p>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span style="font-weight: 700; font-size: 14px;">${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
      </div>`;
  });

  const district = document.getElementById('cDistrict').value;
  const ktmValley = ['Kathmandu', 'Lalitpur', 'Bhaktapur'];
  
  if (ktmValley.includes(district)) { shippingFee = 0; document.getElementById('billShipping').textContent = 'Free'; document.getElementById('billShipping').style.color = '#10B981'; } 
  else if (district === "") { shippingFee = 0; document.getElementById('billShipping').textContent = 'Select District'; document.getElementById('billShipping').style.color = '#EF4444'; } 
  else { shippingFee = 220; document.getElementById('billShipping').textContent = 'Rs. 220'; document.getElementById('billShipping').style.color = 'var(--text-main)'; }

  document.getElementById('billSubtotal').textContent = `Rs. ${subtotal.toLocaleString('en-IN')}`;

  if (appliedCoupon) { 
    discountAmount = Math.round(subtotal * (appliedCoupon.discount_percent / 100)); 
    document.getElementById('billDiscountRow').style.display = 'flex'; 
    document.getElementById('billDiscount').textContent = `- Rs. ${discountAmount.toLocaleString('en-IN')}`; 
  } 
  else { document.getElementById('billDiscountRow').style.display = 'none'; discountAmount = 0; }

  const finalTotal = subtotal - discountAmount + shippingFee;
  document.getElementById('billTotal').textContent = `Rs. ${finalTotal.toLocaleString('en-IN')}`;
  document.getElementById('stickyTotal').textContent = `Rs. ${finalTotal.toLocaleString('en-IN')}`;
}

document.getElementById('cDistrict').addEventListener('change', renderCart);
window.changeQty = function(index, change) { cart[index].quantity += change; if (cart[index].quantity <= 0) cart.splice(index, 1); localStorage.setItem('uma_cart', JSON.stringify(cart)); renderCart(); }
window.removeItem = function(index) { cart.splice(index, 1); localStorage.setItem('uma_cart', JSON.stringify(cart)); renderCart(); }

window.applyCoupon = async function() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  if (!code) return;

  const { data, error } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('is_active', true).single();
  
  if (error || !data) { 
    showToast('Invalid or expired voucher.', 'error'); 
    appliedCoupon = null; 
    renderCart(); 
  } 
  else { 
    appliedCoupon = data; 
    showToast(`Voucher applied! You saved ${data.discount_percent}%.`, 'success'); 
    renderCart(); 
  }
}

document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const district = document.getElementById('cDistrict').value;
  if (!district) { showToast('Please select district.', 'error'); return; }

  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  let txnId = null;

  if (paymentMethod === 'Fonepay QR') {
    txnId = document.getElementById('txnId').value.trim();
    if (!txnId) { showToast('Please enter the Transaction ID after payment.', 'error'); return; }
  }

  document.getElementById('loadingOverlay').style.display = 'flex';
  const name = document.getElementById('cName').value;
  const phone = document.getElementById('cPhone').value;
  const address = document.getElementById('cAddress').value;
  const fullAddress = `${address}, ${district}`;
  
  const finalTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) - discountAmount + shippingFee;
  localStorage.setItem('uma_user_info', JSON.stringify({ name, phone, address, district }));

  try {
    const { data: orderData, error: orderError } = await supabaseClient.from('orders').insert([{ 
      customer_name: name, 
      phone: phone, 
      address: fullAddress, 
      total_amount: finalTotal, 
      payment_method: paymentMethod, 
      customer_email: currentUser ? currentUser.email : 'guest',
      transaction_id: txnId 
    }]).select();

    if (orderError) throw new Error(orderError.message);

    const orderItems = cart.map(item => ({ order_id: orderData[0].id, product_id: item.id, product_name: item.name + (item.size ? ` (Size: ${item.size}, Color: ${item.color})` : ''), price: item.price, quantity: item.quantity, image: item.image }));
    const { error: itemsError } = await supabaseClient.from('order_items').insert(orderItems);

    if (itemsError) throw new Error(itemsError.message);

    for (let i = 0; i < cart.length; i++) {
      const { data: product } = await supabaseClient.from('products').select('stock').eq('id', cart[i].id).single();
      if (product) await supabaseClient.from('products').update({ stock: Math.max(0, product.stock - cart[i].quantity) }).eq('id', cart[i].id);
    }
    
    localStorage.removeItem('uma_cart'); localStorage.setItem('uma_last_phone', phone);
    window.location.href = `/store/success?id=${orderData[0].id}`;

  } catch (error) {
    showToast('Order failed: ' + error.message, 'error');
    document.getElementById('loadingOverlay').style.display = 'none';
  }
});

renderCart();
</script>
</body>
</html>
