<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C3B2D">
<title>Cart - Uma's Fashion Wear</title>

<body>
<header>
  <a href="index.html" style="color: #1A1A1A; text-decoration: none; display: flex; align-items: center;">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
  </a>
  <h1 style="font-size: 20px; color: #1A1A1A; margin: 0; flex: 1; font-weight: 800;">My Cart</h1>
</header>

<div class="container" style="margin-top: 20px;">
  <div id="cartItems" class="cart-container"></div>

  <div class="checkout-box" id="checkoutBox" style="display: none;">
    <h2 class="section-title" style="margin-bottom: 15px;">Delivery Details</h2>
    <form id="checkoutForm">
      <input type="text" id="cName" placeholder="Full Name" required>
      <input type="tel" id="cPhone" placeholder="Phone Number (98XXXXXXXX)" pattern="[9][678][0-9]{8}" maxlength="10" title="Please enter a valid 10-digit Nepal number" required>
      <select id="cDistrict" required style="width: 100%; padding: 15px; border: 1px solid #E5E7EB; border-radius: 12px; margin-bottom: 15px; font-size: 15px; background: #FAFAFA; outline: none; font-weight: 500;">
        <option value="">Select District</option>
        <option value="Kathmandu">Kathmandu</option>
        <option value="Lalitpur">Lalitpur</option>
        <option value="Bhaktapur">Bhaktapur</option>
        <option value="Kaski">Kaski</option>
        <option value="Chitwan">Chitwan</option>
        <option value="Morang">Morang</option>
        <option value="Other">Other District</option>
      </select>
      <textarea id="cAddress" placeholder="Full Delivery Address (Area, Landmark)" required></textarea>
      
      <h2 class="section-title" style="margin: 25px 0 15px;">Available Coupons</h2>
      <div class="available-coupons" id="couponList"></div>

      <h2 class="section-title" style="margin: 25px 0 15px;">Have a Coupon?</h2>
      <div class="coupon-box">
        <input type="text" id="couponInput" placeholder="Enter coupon code">
        <button type="button" onclick="applyCoupon(document.getElementById('couponInput').value)">Apply</button>
      </div>
      <p id="couponMsg" style="font-size: 13px; font-weight: 600; margin-bottom: 15px;"></p>

      <h2 class="section-title" style="margin: 25px 0 15px;">Payment Method</h2>
      <div class="payment-options">
        <label class="pay-option">
          <input type="radio" name="payment" value="Cash on Delivery" checked>
          <span style="flex: 1;">Cash on Delivery</span>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="eSewa">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Esewa_Logo.svg/256px-Esewa_Logo.svg.png" alt="eSewa" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
          <span style="display: none; color: #60bb46; font-weight: 800; font-size: 18px; font-family: sans-serif;">eSewa</span>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="Khalti">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Khalti_Logo.svg/256px-Khalti_Logo.svg.png" alt="Khalti" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
          <span style="display: none; color: #5c2d91; font-weight: 800; font-size: 18px; font-family: sans-serif;">Khalti</span>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="IME Pay">
          <span style="flex: 1; color: #d32f2f; font-weight: 800; font-style: italic; font-size: 18px;">IME Pay</span>
        </label>
      </div>

      <div id="discountRow" class="discount-row" style="display: none;">
        <span>Discount:</span>
        <span id="discountAmount">- Rs. 0</span>
      </div>

      <div class="discount-row" style="color: #1A1A1A; display: flex;">
        <span>Delivery Charge:</span>
        <span id="shippingAmount">Rs. 0</span>
      </div>

      <div class="total-row">
        <span>Total:</span>
        <span id="cartTotal">Rs. 0</span>
      </div>
      
      <button type="submit" class="place-order-btn" id="orderBtn">Place Order</button>
    </form>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p>Confirming your order...</p>
</div>

<a href="https://wa.me/9779851169457" class="whatsapp-float" target="_blank">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

let cart = JSON.parse(localStorage.getItem('uma_cart')) || [];
let appliedCoupon = null;
let discountAmount = 0;
let shippingFee = 0;
let currentUser = null;

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    const savedInfo = JSON.parse(localStorage.getItem('uma_user_info'));
    if (savedInfo) {
      document.getElementById('cName').value = savedInfo.name || '';
      document.getElementById('cPhone').value = savedInfo.phone || '';
      document.getElementById('cDistrict').value = savedInfo.district || '';
      document.getElementById('cAddress').value = savedInfo.address || '';
    }
  }
});

async function loadAvailableCoupons() {
  const { data } = await supabaseClient.from('coupons').select('*').eq('is_active', true);
  const container = document.getElementById('couponList');
  if (data && data.length > 0) {
    data.forEach(c => {
      container.innerHTML += `
        <div class="coupon-chip" onclick="applyCoupon('${c.code}')">
          🎟️ ${c.code} - ${c.discount_percent}% OFF
        </div>
      `;
    });
  } else {
    container.innerHTML = '<p style="font-size: 13px; color: #666;">No active coupons available right now.</p>';
  }
}

function renderCart() {
  const itemsDiv = document.getElementById('cartItems');
  const checkoutBox = document.getElementById('checkoutBox');
  const totalSpan = document.getElementById('cartTotal');
  const discountRow = document.getElementById('discountRow');
  const discountSpan = document.getElementById('discountAmount');
  const shippingSpan = document.getElementById('shippingAmount');
  const district = document.getElementById('cDistrict').value;
  
  itemsDiv.innerHTML = '';
  let subtotal = 0;

  if (cart.length === 0) {
    itemsDiv.innerHTML = '<p style="text-align: center; color: #999; padding: 20px; font-weight: 500;">Your cart is empty.</p>';
    checkoutBox.style.display = 'none';
    return;
  }

  checkoutBox.style.display = 'block';

  cart.forEach((item, index) => {
    subtotal += item.price * item.quantity;
    itemsDiv.innerHTML += `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="cart-details">
          <h3>${item.name}</h3>
          <p style="font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500;">Size: ${item.size || 'Free'}</p>
          <p class="price">Rs. ${item.price}</p>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span style="font-weight: 700; font-size: 16px;">${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        </div>
      </div>
    `;
  });

  const ktmValley = ['Kathmandu', 'Lalitpur', 'Bhaktapur'];
  if (ktmValley.includes(district)) {
    shippingFee = 0;
    shippingSpan.textContent = 'Free';
    shippingSpan.style.color = '#10B981';
  } else if (district === "") {
    shippingFee = 0;
    shippingSpan.textContent = 'Select District';
    shippingSpan.style.color = '#EF4444';
  } else {
    shippingFee = 220;
    shippingSpan.textContent = 'Rs. 220';
    shippingSpan.style.color = '#1A1A1A';
  }

  if (appliedCoupon) {
    discountAmount = Math.round(subtotal * (appliedCoupon.discount_percent / 100));
    discountRow.style.display = 'flex';
    discountSpan.textContent = `- Rs. ${discountAmount}`;
  } else {
    discountRow.style.display = 'none';
    discountAmount = 0;
  }

  const finalTotal = subtotal - discountAmount + shippingFee;
  totalSpan.textContent = `Rs. ${finalTotal}`;
}

document.getElementById('cDistrict').addEventListener('change', renderCart);

window.changeQty = function(index, change) {
  cart[index].quantity += change;
  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }
  localStorage.setItem('uma_cart', JSON.stringify(cart));
  renderCart();
}

window.removeItem = function(index) {
  cart.splice(index, 1);
  localStorage.setItem('uma_cart', JSON.stringify(cart));
  renderCart();
}

window.applyCoupon = async function(codeFromChip) {
  let code = '';
  if (typeof codeFromChip === 'string') {
    code = codeFromChip.toUpperCase();
    document.getElementById('couponInput').value = code;
  } else {
    code = document.getElementById('couponInput').value.trim().toUpperCase();
  }
  
  const msg = document.getElementById('couponMsg');
  if (!code) return;

  const { data, error } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('is_active', true).single();

  if (error || !data) {
    msg.textContent = 'Invalid or expired coupon code.';
    msg.style.color = '#EF4444';
    appliedCoupon = null;
    renderCart();
  } else {
    appliedCoupon = data;
    msg.textContent = `Coupon applied! You got ${data.discount_percent}% OFF.`;
    msg.style.color = '#10B981';
    renderCart();
  }
}

document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const district = document.getElementById('cDistrict').value;
  if (!district) {
    alert('Please select your district for delivery.');
    return;
  }

  document.getElementById('loadingOverlay').style.display = 'flex';

  const name = document.getElementById('cName').value;
  const phone = document.getElementById('cPhone').value;
  const address = document.getElementById('cAddress').value;
  const fullAddress = `${address}, ${district}`;
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  const finalTotal = subtotal - discountAmount + shippingFee;

  localStorage.setItem('uma_user_info', JSON.stringify({ name, phone, address, district }));

  const userEmail = currentUser ? currentUser.email : 'guest';

  const { data: orderData, error: orderError } = await supabaseClient
    .from('orders')
    .insert([{ customer_name: name, phone: phone, address: fullAddress, total_amount: finalTotal, payment_method: paymentMethod, customer_email: userEmail }])
    .select();

  if (orderError) {
    alert('Error placing order: ' + orderError.message);
    document.getElementById('loadingOverlay').style.display = 'none';
    return;
  }

  const orderId = orderData[0].id;
  const orderItems = cart.map(item => ({
    order_id: orderId,
    product_id: item.id,
    product_name: item.name + (item.size ? ` (Size: ${item.size})` : ''),
    price: item.price,
    quantity: item.quantity,
    image: item.image
  }));

  const { error: itemsError } = await supabaseClient.from('order_items').insert(orderItems);

  if (itemsError) {
    alert('Error saving items: ' + itemsError.message);
    document.getElementById('loadingOverlay').style.display = 'none';
  } else {
    for (let i = 0; i < cart.length; i++) {
      const item = cart[i];
      const { data: product } = await supabaseClient.from('products').select('stock').eq('id', item.id).single();
      if (product) {
        const newStock = Math.max(0, product.stock - item.quantity);
        await supabaseClient.from('products').update({ stock: newStock }).eq('id', item.id);
      }
    }
    localStorage.removeItem('uma_cart');
    localStorage.setItem('uma_last_phone', phone);
    window.location.href = `success.html?id=${orderId}`;
  }
});

loadAvailableCoupons();
renderCart();
</script>
</body>
