<!DOCTYPE html>
<html lang="en">
<head>
<base href="/store/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C3B2D">
<title>Order Success - Uma's Fashion Wear</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
.receipt-card { background: white; border-radius: 20px; padding: 30px; margin: 20px auto; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
.receipt-icon { font-size: 70px; color: #10B981; margin-bottom: 15px; animation: pop 0.5s ease-out; }
@keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
.receipt-card h2 { font-size: 24px; color: #1A1A1A; font-weight: 800; margin-bottom: 5px; }
.receipt-card p { font-size: 14px; color: #666; font-weight: 500; margin-bottom: 25px; }
.receipt-details { text-align: left; background: #FAFAFA; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed #E5E7EB; }
.receipt-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: #4B5563; }
.receipt-row span:last-child { color: #1A1A1A; font-weight: 800; }
.receipt-row.total { border-top: 1px solid #E5E7EB; padding-top: 15px; margin-top: 15px; font-size: 18px; color: #1A1A1A; }
.receipt-row.total span:last-child { color: #C59B5F; }
.btn-wa { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; background: #25D366; color: white; text-decoration: none; border-radius: 12px; font-weight: 800; font-size: 16px; box-shadow: 0 4px 15px rgba(37,211,102,0.3); margin-bottom: 15px; }
.btn-wa svg { width: 24px; height: 24px; fill: white; }
.btn-continue { display: block; width: 100%; padding: 16px; background: #1C3B2D; color: white; text-decoration: none; border-radius: 12px; font-weight: 800; font-size: 16px; text-align: center; box-shadow: 0 4px 15px rgba(28,59,45,0.3); }
</style>
</head>
<body>

<div class="receipt-card" id="receiptCard" style="display: none;">
  <div class="receipt-icon">✅</div>
  <h2>Order Confirmed!</h2>
  <p>Thank you for shopping with Uma's Fashion Wear.</p>
  
  <div class="receipt-details" id="receiptDetails"></div>
  
  <a href="#" id="waBtn" class="btn-wa" target="_blank">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
    Confirm on WhatsApp
  </a>
  
  <a href="index.html" class="btn-continue">Continue Shopping</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

async function loadReceipt() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  
  if (!orderId) {
    window.location.href = 'index.html';
    return;
  }

  const { data: order, error } = await supabaseClient
    .from('orders')
    .select('*, order_items(*)')
    .eq('id', orderId)
    .single();

  if (error || !order) {
    window.location.href = 'index.html';
    return;
  }

  document.getElementById('receiptCard').style.display = 'block';

  let itemsHtml = '';
  let itemNames = '';
  order.order_items.forEach(item => {
    itemsHtml += `<div class="receipt-row"><span>${item.product_name} x${item.quantity}</span><span>Rs. ${item.price * item.quantity}</span></div>`;
    itemNames += `${item.product_name} (x${item.quantity}), `;
  });

  document.getElementById('receiptDetails').innerHTML = `
    <div class="receipt-row"><span>Order ID:</span><span>#${order.id}</span></div>
    <div class="receipt-row"><span>Name:</span><span>${order.customer_name}</span></div>
    <div class="receipt-row"><span>Phone:</span><span>${order.phone}</span></div>
    <div class="receipt-row"><span>Address:</span><span>${order.address}</span></div>
    ${itemsHtml}
    <div class="receipt-row total"><span>Total Paid:</span><span>Rs. ${order.total_amount}</span></div>
  `;

  const waText = encodeURIComponent(`Hello Uma's Fashion Wear! I just placed an order.\n\nOrder ID: #${order.id}\nName: ${order.customer_name}\nItems: ${itemNames}\nTotal: Rs. ${order.total_amount}\nPayment: ${order.payment_method}\n\nPlease confirm my order. (Contact: 9849919457)`);
  document.getElementById('waBtn').href = `https://wa.me/9779851169457?text=${waText}`;
}

loadReceipt();
</script>
</body>
</html>
