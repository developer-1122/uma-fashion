<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C3B2D">
<title>My Account - Uma's Fashion Wear</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="/store/style.css">
</head>
<body>
<header><h1 style="font-size: 20px; margin: 0; flex: 1; text-align: center; font-weight: 800;">My Account</h1></header>

<div class="container" style="margin-top: 20px;">
  <div id="authSection" style="display: block;">
    <div class="profile-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</div>
        <div class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</div>
      </div>
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email Address" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="auth-btn">Login</button>
        <p id="loginMsg" style="text-align: center; font-size: 13px; font-weight: 600; margin-top:10px;"></p>
      </form>
      <form id="signupForm" class="auth-form" style="display: none;">
        <input type="text" id="signupName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email Address" required>
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit" class="auth-btn">Create Account</button>
        <p id="signupMsg" style="text-align: center; font-size: 13px; font-weight: 600; margin-top:10px;"></p>
      </form>
    </div>
    <div class="profile-card" style="text-align: center;">
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">Or track your order without login</p>
      <form id="trackForm" style="display: flex; gap: 10px;">
        <input type="tel" id="trackPhone" placeholder="98XXXXXXXX" pattern="[9][678][0-9]{8}" maxlength="10" required style="flex: 1; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; background: var(--bg-color); color: var(--text-main); outline: none;">
        <button type="submit" style="padding: 12px 24px; background: var(--primary); color: var(--primary-text); border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer;">Track</button>
      </form>
    </div>
  </div>
  <div id="userSection" style="display: none;">
    <div class="profile-card" style="display: flex; justify-content: space-between; align-items: center;">
      <div><p style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Logged in as</p><strong id="userEmailDisplay" style="font-size: 16px; color: var(--text-main);">user@email.com</strong></div>
      <button class="logout-profile-btn" onclick="logoutCustomer()">Logout</button>
    </div>
  </div>
  <div id="ordersContainer"></div>
</div>

<a href="https://wa.me/9779851169457" class="whatsapp-float" target="_blank">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
</a>

<div class="bottom-nav">
  <a href="/store/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a href="wishlist" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
  <a href="cart" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Cart</span></a>
  <a href="profile" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
if (localStorage.getItem('uma_theme') === 'dark') document.body.classList.add('dark-mode');

let currentUser = null;
function switchAuthTab(tab) {
  if (tab === 'login') { document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabSignup').classList.remove('active'); document.getElementById('loginForm').style.display = 'block'; document.getElementById('signupForm').style.display = 'none'; } 
  else { document.getElementById('tabLogin').classList.remove('active'); document.getElementById('tabSignup').classList.add('active'); document.getElementById('loginForm').style.display = 'none'; document.getElementById('signupForm').style.display = 'block'; }
}

async function checkUser() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session ? session.user : null;
  if (currentUser) {
    document.getElementById('authSection').style.display = 'none'; document.getElementById('userSection').style.display = 'block'; document.getElementById('userEmailDisplay').textContent = currentUser.email;
    fetchUserOrders(currentUser.email);
  } else {
    document.getElementById('authSection').style.display = 'block'; document.getElementById('userSection').style.display = 'none'; document.getElementById('ordersContainer').innerHTML = '';
    const lastPhone = localStorage.getItem('uma_last_phone');
    if (lastPhone) { document.getElementById('trackPhone').value = lastPhone; fetchOrdersByPhone(lastPhone); }
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const msg = document.getElementById('loginMsg');
  const { error } = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value });
  if (error) { msg.textContent = error.message; msg.style.color = '#EF4444'; } else { msg.textContent = 'Login successful!'; msg.style.color = '#10B981'; checkUser(); }
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const msg = document.getElementById('signupMsg');
  const { error } = await supabaseClient.auth.signUp({ email: document.getElementById('signupEmail').value, password: document.getElementById('signupPassword').value, options: { data: { full_name: document.getElementById('signupName').value } } });
  if (error) { msg.textContent = error.message; msg.style.color = '#EF4444'; } else { msg.textContent = 'Account created! Login now.'; msg.style.color = '#10B981'; switchAuthTab('login'); }
});

window.logoutCustomer = async function() { await supabaseClient.auth.signOut(); checkUser(); }
document.getElementById('trackForm').addEventListener('submit', (e) => { e.preventDefault(); fetchOrdersByPhone(document.getElementById('trackPhone').value); });

async function fetchUserOrders(email) {
  document.getElementById('ordersContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Loading...</p>';
  const { data } = await supabaseClient.from('orders').select('*, order_items(*)').eq('customer_email', email).order('created_at', { ascending: false });
  if (!data || data.length === 0) { document.getElementById('ordersContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">No orders found.</p>'; return; }
  renderOrders(data, email);
}

async function fetchOrdersByPhone(phone) {
  document.getElementById('ordersContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Searching...</p>';
  const { data } = await supabaseClient.from('orders').select('*, order_items(*)').eq('phone', phone).order('created_at', { ascending: false });
  if (!data || data.length === 0) { document.getElementById('ordersContainer').innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">No orders found.</p>'; return; }
  renderOrders(data, null);
}

function renderOrders(data, email) {
  const container = document.getElementById('ordersContainer'); container.innerHTML = '';
  data.forEach(order => {
    const date = new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const statusColor = order.status === 'Delivered' ? '#10B981' : (order.status === 'Cancelled' ? '#EF4444' : '#F59E0B');
    let itemsHtml = ''; order.order_items.forEach(item => { itemsHtml += `<div style="font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 500;"><span>${item.product_name} x${item.quantity}</span><span>Rs. ${item.price}</span></div>`; });
    let noteHtml = order.admin_note ? `<div style="background: #FFF8E1; border-left: 3px solid #F59E0B; padding: 10px; border-radius: 6px; margin-bottom: 12px;"><p style="font-size: 12px; color: #B45309; font-weight: 700; margin-bottom: 4px;">Message from Store:</p><p style="font-size: 13px; color: #78350F; font-weight: 500;">${order.admin_note}</p></div>` : '';
    
    let timelineHtml = '';
    if (order.status !== 'Cancelled') {
      const isShipped = order.status === 'Shipped' || order.status === 'Delivered'; const isDelivered = order.status === 'Delivered';
      timelineHtml = `<div class="timeline"><div class="timeline-step active"><div class="timeline-dot"></div><span>Placed</span></div><div class="timeline-step ${isShipped ? 'active' : ''}"><div class="timeline-dot"></div><span>Shipped</span></div><div class="timeline-step ${isDelivered ? 'active' : ''}"><div class="timeline-dot"></div><span>Delivered</span></div></div>`;
    } else { timelineHtml = `<div class="timeline"><div class="timeline-step cancelled"><div class="timeline-dot"></div><span>Cancelled</span></div></div>`; }
    
    let trackingHtml = order.tracking_number ? `<div style="background: rgba(28, 59, 45, 0.05); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--primary);">📦 Tracking Number: <strong>${order.tracking_number}</strong></div>` : '';
    let cancelBtnHtml = order.status === 'Pending' ? `<button class="cancel-btn" onclick="cancelOrder(${order.id}, '${order.phone}', '${email}')">Cancel Order</button>` : '';

    container.innerHTML += `
      <div class="order-status-card" style="border-left-color: ${statusColor};">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><strong style="font-size: 15px; color: var(--text-main);">Order #${order.id}</strong><span style="font-size: 12px; font-weight: 800; color: ${statusColor}; background: ${statusColor}15; padding: 4px 8px; border-radius: 6px;">${order.status}</span></div>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500;">Date: ${date} | Payment: ${order.payment_method || 'COD'}</p>
        ${timelineHtml} 
        ${trackingHtml}
        ${noteHtml}
        <div style="background: var(--bg-color); padding: 12px; border-radius: 8px; margin-bottom: 12px;">${itemsHtml}</div>
        <div style="text-align: right; font-weight: 800; font-size: 16px; color: var(--gold);">Total: Rs. ${order.total_amount}</div>
        ${cancelBtnHtml}
      </div>`;
  });
}

window.cancelOrder = async function(orderId, phone, email) {
  if (confirm('Are you sure you want to cancel this order?')) {
    const { error } = await supabaseClient.from('orders').update({ status: 'Cancelled' }).eq('id', orderId);
    if (!error) { if (email) fetchUserOrders(email); else fetchOrdersByPhone(phone); }
  }
}
checkUser();
</script>
</body>
</html>
